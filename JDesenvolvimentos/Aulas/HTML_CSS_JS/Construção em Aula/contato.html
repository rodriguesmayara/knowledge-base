<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Página de Contato</title>
</head>
<body>
   <!-- Menu de Navegação das Páginas -->
    <header>
        <div id="logo">
            <img src="/imagens/devcursos.png" alt="devcursos">
        </div>
        <div id="menu">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li>
                    <a href="#" >Cursos
                        <ul class="cursos">
                            <a href="/html.html"><li>HTML</li></a>
                            <a href="/css.html"><li>CSS</li></a>
                            <a href="/javascript.html"><li>JavaScript</li></a>
                        </ul>
                    </a>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav> 
        </div>
        <div id="acesso">
            <button id="btnAcesso" class="botao"> Inscreva-se </button>
        </div>
    </header>   
    <main>
        <form action=""class = "formContato">
            <legend>Formulário de Contato</legend>
            <input type="text" name="nome" placeholder="Seu Nome" class="campoForm" required>
            <input type="email" name="email" placeholder="Seu E-mail" class="campoForm" required>
            <textarea name="mensagem" placeholder="Por favor, deixe sua Mensagem :)" class="campoForm mensagemForm" rows="8" required></textarea>
            <div class="controleFrom">
                <input type="reset" value="Limpar" class="botao cancela">
                <button class="btEnviar botao confirma">Enviar</button>
            </div>
        </form>
    </main>

</body>
