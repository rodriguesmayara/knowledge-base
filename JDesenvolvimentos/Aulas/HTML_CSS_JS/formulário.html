<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <h1>Formulário de Cadastro</h1>
    </header>
    <main>
        <form action="recebe.html" method="post"> 
            <div>  
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            <div>
                 <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="0" required>
            </div>
            <div>
                <label for="uf">UF:</label>
                <input type="text" id="uf" name="uf" maxlength="2" required>
            </div>
            <div>
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" required>
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div>
                <label for="ckbAtivo">Ativo</label>
                <input type="checkbox" id="ckbAtivo" name="ckbAtivo">
            </div>
            <div>
                <label for="sexo">Observação:</label>
                <textarea id="observacao" name="observacao" rows="4" cols="50"></textarea>
            </div>
            <div> 
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar"> 
            </div>
    </main>
</footer>
        <p>&copy; 2026 Formulário de Cadastro. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
