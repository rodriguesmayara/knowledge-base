<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <h1>Formulário de Cadastro</h1>
    </header>
    <main>
        <form action="#">
            <div>
                <label for="txtNome">Nome</label>
                <input type="text" id="txtNome" maxlength="5" required placeholder="Nome completo">
            </div>
            <div>
                <label for="">E-mail</label>
                <input type="email" name="" id="">
            </div>
            <div>
                <label for="">UF</label>
                <input type="text" name="" id="" maxlength="2">
            </div>
            <div>
                <label for="">Idade</label>
                <input type="number" name="" id="" min="0">
            </div>
            <div>
                <label for="">Login</label>
                <input type="text">
            </div>
            <div>
                <label for="">Senha</label>
                <input type="password" name="" id="">
            </div>
            <div>
                <label for="ckbAtivo">Ativo</label>
                <input type="checkbox" name="" id="ckbAtivo">
            </div>
            <div>
                <label for="">Observação</label>
                <textarea name="" id=""></textarea>
            </div>
            <div>
                <input type="submit" value="Cadastrar">
                <input type="reset" value="Cancelar">
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 JDesenvolvimentos</p>
    </footer>
</body>
</html>
