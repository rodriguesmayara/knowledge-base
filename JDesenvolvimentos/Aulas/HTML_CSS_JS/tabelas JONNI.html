<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <header>
        <h1>Tabelas em HTML</h1>
    </header>
    <nav></nav>
    <main>
        <section>
            <h2>Uso de Tabelas em HTML</h2>
            <article>
                <h3>Estrutura da Tabela já com exemplo.</h3>
                <div>
                    <table border="1" width="50%">
                        <thead>
                            <tr>
                                <th colspan="4">Tabela de cursos disponíveis</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td rowspan="5" valign="top" >JDesenvolvimentos</td>
                            </tr>
                            <tr bgcolor="silver">
                                <td>Curso</td>
                                <td align="center">Nível</td>
                                <td align="right">Carga Horária</td>
                            </tr>
                            <tr>
                                <td>HTML</td>
                                <td align="center">Básico</td>
                                <td align="right">10 horas</td>
                            </tr>
                            <tr>
                                <td>CSS</td>
                                <td align="center">Básico</td>
                                <td align="right">10 horas</td>
                            </tr>
                            <tr>
                                <td>JavaScript</td>
                                <td align="center">Básico</td>
                                <td align="right">10 horas</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" align="right">Carga Horária Total:</td>
                                <td align="right">30 horas</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 JDesenvolvimentos</p>
    </footer>
</body>
</html>
