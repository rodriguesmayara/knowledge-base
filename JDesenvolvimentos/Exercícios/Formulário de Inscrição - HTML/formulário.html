<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição - JDesenvolvimentos</title>
</head>
<body>
    <nav>
            <a href="formulário.html">Formulário de Inscrição</a> /
            <a href="/JDesenvolvimentos/Exercícios/Construção de Tabela - HTML/tabela.html">Cursos Disponíveis</a>   
    </nav>
    <hr>
    <header>
        <h1>Formulário de Inscrição - JDesenvolvimentos</h1>
    </header>
    <hr>
    <main>
        <section>
            <form action="">
                <!-- Campo de nome -->
                <label for="nome">Nome Completo:</label>
                 <input type="text" id="nome" name="nome" placeholder="João Silva Santos" required>
                <br><br>

                <!-- Campo de e-mail -->
                <label for="email">E-mail:</label>
                 <input type="email" id="email" name="email" placeholder="joao.silva@example.com" required>
                <br><br>

                <!-- Campo de telefone -->
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="15" required>
                <br><br>

                <!-- Campo de data -->
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento">
                <br><br>

                 <!-- Campo de caixa de seleção de curso-->
                <label for="curso">Curso Desejado:</label>
                <select name="curso" id="curso">
                <option value="" selected disabled>Selecione uma das opções...</option>
                <option value="html">HTML, CSS e JavaScript</option>
                <option value="python">Python</option>
                <option value="php">PHP</option>
                <option value="logica">Lógica de Programação</option>
                <option value="mysql">MySQL</option>
                <option value="sql">SQL & Banco de Dados</option>
                </select>
                <br><br>

                <!-- Campo de seleção de nível de conhecimento -->
                <label>Nível de Conhecimento:</label>
                <input type="radio" id="iniciante" name="nivel" value="iniciante">
                <label for="iniciante">Iniciante</label>
                <input type="radio" id="intermediario" name="nivel" value="intermediario">
                <label for="intermediario">Intermediário</label>
                <input type="radio" id="avancado" name="nivel" value="avancado">
                <label for="avancado">Avançado</label>
                <br><br>

                <!-- Campo de seleção de disponibilidade -->
                <label>Assinale as suas disponibilidades para as aulas:</label>
                <input type="checkbox" id="sabado" name="disponibilidade" value="sabado">
                <label for="sabado">Sábado - 13hrs as 17hrs</label>
                <input type="checkbox" id="domingo" name="disponibilidade" value="domingo">
                <label for="domingo">Domingo - 13hrs as 17hrs</label>
                <input type="checkbox" id="outro" name="disponibilidade" value="outro">
                <label for="outro">Outra disponibilidade</label>
                <br><br>

                <!-- Campo de área de texto -->
                <label for="sobre">Sobre o Objetivo:</label>
                <textarea name="sobre" id="sobre" cols="30" rows="4" placeholder="Fale um pouco sobre qual seu obejtivo com o treinamento..."></textarea>
                <br><br>

                <!-- Concordar com os termos -->
                <label>
                    <input type="checkbox" name="termos" value="aceito" required>
                    Concordo com os termos e condições
                </label>
                <br><br>

                <!-- Botão de envio e reset -->
                <button type="submit">Enviar</button>
                <input type="reset" value="Limpar">
            </form>
        </section>
    </main>
    <hr>
    <footer>
        <p>&copy; 2026 JDesenvolvimentos. Todos os direitos reservados.</p> 
    </footer>
    <hr>
</body>
</html>
