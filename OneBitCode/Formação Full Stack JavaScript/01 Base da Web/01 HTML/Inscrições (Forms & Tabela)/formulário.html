<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
</head>
<body>
    <h1>Formulário de Inscrição</h1>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="telefone">WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone" required>
        <br><br>

        <label>Área de Atuação:</label>
        <input type="radio" id="desenvolvimento" name="area_atuacao" value="desenvolvimento">
        <label for="desenvolvimento">Desenvolvimento</label>
        <input type="radio" id="quality_assurance" name="area_atuacao" value="quality_assurance">
        <label for="quality_assurance">Quality Assurance (QA)</label>
        <input type="radio" id="analise_dados" name="area_atuacao" value="analise_dados">
        <label for="analise_dados">Análise de Dados</label>
        <input type="radio" id="infraestrutura" name="area_atuacao" value="infraestrutura">
        <label for="infraestrutura">Infraestrutura</label>
        <br><br>

        <label>Observações:</label>
        <textarea name="observacoes" id="observacoes" cols="40" rows="6" placeholder="Adicione quaisquer informações adicionais..."></textarea>
        <br><br>

        <label>Interesses:</label>
        <input type="checkbox" id="notificação" name="interesses" value="backend">
        <label for="notificação">Desejo ser notificado sobre novidades e ofertas por e-mail.</label>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
